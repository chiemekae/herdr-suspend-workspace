# Weekly check for commits on asermax/herdr-suspend-workspace that this fork
# doesn't have yet. Keeps one open issue up to date while it's behind, and
# closes it once the fork has caught up (sync with "Sync fork" or
# `git fetch upstream && git merge upstream/main`).
name: Upstream check

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPSTREAM: asermax/herdr-suspend-workspace
          TITLE: Upstream has new commits
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          # Commits on upstream main that this fork's main doesn't have.
          # COMPARE_BASE and DRY_RUN are only for trying the script by hand.
          compare=$(gh api "repos/$UPSTREAM/compare/${COMPARE_BASE:-$owner:main}...main")
          ahead=$(jq -r '.ahead_by' <<<"$compare")
          issue=$(gh issue list -R "$REPO" --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ "$ahead" -eq 0 ]; then
            echo "Up to date with $UPSTREAM."
            if [ -n "$issue" ]; then
              ${DRY_RUN:+echo} gh issue close "$issue" -R "$REPO" --comment "Caught up with upstream."
            fi
            exit 0
          fi

          body=$(jq -r --arg up "$UPSTREAM" '
            "[\(.ahead_by) commit(s)](https://github.com/\($up)/compare/\(.merge_base_commit.sha[0:7])...main) on `\($up)` main that this fork does not have:\n\n"
            + (.commits | map("- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])") | join("\n"))
            + "\n\nSync with **Sync fork** on GitHub, or `git fetch upstream && git merge upstream/main`. This issue closes itself on the next check after the fork catches up."
          ' <<<"$compare")
          echo "$body"

          if [ -n "$issue" ]; then
            ${DRY_RUN:+echo} gh issue edit "$issue" -R "$REPO" --body "$body"
          else
            ${DRY_RUN:+echo} gh issue create -R "$REPO" --title "$TITLE" --body "$body"
          fi
